name: Build and Push Backend Image

on:
  push:
    branches:
      - dev
  pull_request:
    types: [closed]
    branches:
      - test
      - staging
      - prod

jobs:
  build-and-push:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image name
        id: image
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          else
            BRANCH_NAME="${{ github.base_ref }}"
          fi
          
          IMAGE_NAME=""
          
          if [[ "$BRANCH_NAME" == "dev" ]]; then
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/kapuletu-backend-dev"
          elif [[ "$BRANCH_NAME" == "test" ]]; then
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/kapuletu-backend-test"
          elif [[ "$BRANCH_NAME" == "staging" ]]; then
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/kapuletu-backend-staging"
          elif [[ "$BRANCH_NAME" == "prod" ]]; then
            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/kapuletu-backend"
          else
            echo "Unsupported branch: $BRANCH_NAME"
            exit 1
          fi
          
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
