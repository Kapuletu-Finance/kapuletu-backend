name: Backend Deployment (STAGING)

# on:
#   push:
#     branches:
#       - staging
#   workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  STAGE: staging
  PYTHON_VERSION: "3.11"
  ARTIFACT_BUCKET: kapuletu-staging-assets
  ARTIFACT_KEY: backend.zip

jobs:
  deploy:
    name: Package and Upload to S3
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -t ./lib -r requirements.txt
          
          # AGGRESSIVE CLEANUP
          cd lib
          rm -rf boto3* botocore* jmespath* s3transfer*
          rm -rf *.dist-info *.egg-info
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type d -name "tests" -exec rm -rf {} +
          find . -type d -name "doc" -exec rm -rf {} +
          cd ..

      - name: Run Linting (Ruff)
        run: |
          ruff check . --exit-zero

      # -----------------------------
      # AWS OIDC AUTH
      # -----------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # PACKAGE (ZIP)
      # -----------------------------
      - name: Package Application
        run: |
          cd lib
          zip -r ../${{ env.ARTIFACT_KEY }} .
          cd ..
          zip -g ${{ env.ARTIFACT_KEY }} *.py
          zip -rg ${{ env.ARTIFACT_KEY }} common/
          zip -rg ${{ env.ARTIFACT_KEY }} services/
          zip -rg ${{ env.ARTIFACT_KEY }} models/
          zip -rg ${{ env.ARTIFACT_KEY }} repositories/
          zip -rg ${{ env.ARTIFACT_KEY }} schemas/

      # -----------------------------
      # UPLOAD TO S3
      # -----------------------------
      - name: Upload Artifact to S3
        run: |
          aws s3 cp ${{ env.ARTIFACT_KEY }} s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}
          echo "### Artifact Uploaded Successfully ✅" >> $GITHUB_STEP_SUMMARY
