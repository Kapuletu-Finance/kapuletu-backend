name: Backend Deployment (DEV)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  STAGE: dev
  PYTHON_VERSION: "3.11"
  ARTIFACT_BUCKET: kapuletu-dev-assets
  ARTIFACT_KEY: backend.zip

jobs:
  deploy:
    name: Package and Upload to S3
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # Install dependencies into a local folder
          pip install -t ./lib -r requirements.txt
          
          # ---------------------------------------------------------
          # AGGRESSIVE CLEANUP TO STAY UNDER 250MB LIMIT
          # ---------------------------------------------------------
          cd lib
          # Remove boto3 and botocore (they are in the Lambda runtime)
          rm -rf boto3* botocore* jmespath* s3transfer*
          # Remove metadata and info folders
          rm -rf *.dist-info *.egg-info
          # Remove cache and tests
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type d -name "tests" -exec rm -rf {} +
          # Remove documentation and other bloat
          find . -type d -name "doc" -exec rm -rf {} +
          find . -type d -name "docs" -exec rm -rf {} +
          cd ..

      - name: Run Linting (Ruff)
        run: |
          ruff check . --exit-zero

      # -----------------------------
      # AWS OIDC AUTH
      # -----------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # PACKAGE (ZIP)
      # -----------------------------
      - name: Package Application
        run: |
          cd lib
          zip -r ../${{ env.ARTIFACT_KEY }} .
          cd ..
          # Add source code (only the essentials)
          zip -g ${{ env.ARTIFACT_KEY }} *.py
          zip -rg ${{ env.ARTIFACT_KEY }} common/
          zip -rg ${{ env.ARTIFACT_KEY }} services/
          zip -rg ${{ env.ARTIFACT_KEY }} models/
          zip -rg ${{ env.ARTIFACT_KEY }} repositories/
          zip -rg ${{ env.ARTIFACT_KEY }} schemas/
          
          echo "### Package Size Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Final Zip Size: $(du -h ${{ env.ARTIFACT_KEY }} | cut -f1)" >> $GITHUB_STEP_SUMMARY

      # -----------------------------
      # UPLOAD TO S3
      # -----------------------------
      - name: Upload Artifact to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp ${{ env.ARTIFACT_KEY }} s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}
          echo "### Artifact Uploaded Successfully ✅" >> $GITHUB_STEP_SUMMARY