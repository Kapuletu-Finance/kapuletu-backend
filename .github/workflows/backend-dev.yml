name: Backend Deployment (DEV)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  STAGE: dev
  PYTHON_VERSION: "3.11"
  ARTIFACT_BUCKET: kapuletu-dev-assets
  ARTIFACT_KEY: backend.zip

jobs:
  deploy:
    name: Package and Upload to S3
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt
          # We install dependencies into a local folder for packaging
          pip install -t ./lib -r requirements.txt
          echo "### Dependencies Installed" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Packages: $(pip list | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: Run Linting (Ruff)
        run: |
          ruff check .
          echo "### Linting Passed ✅" >> $GITHUB_STEP_SUMMARY

      # -----------------------------
      # AWS OIDC AUTH
      # -----------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Connection
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ROLE_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "### AWS Connection Status ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Account ID:** $ACCOUNT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Assumed Role:** $ROLE_ARN" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY

      # -----------------------------
      # PACKAGE (ZIP)
      # -----------------------------
      - name: Package Application
        run: |
          # Create a deployment package including dependencies and source code
          cd lib
          zip -r ../${{ env.ARTIFACT_KEY }} .
          cd ..
          zip -g ${{ env.ARTIFACT_KEY }} *.py
          zip -rg ${{ env.ARTIFACT_KEY }} common/
          zip -rg ${{ env.ARTIFACT_KEY }} services/
          zip -rg ${{ env.ARTIFACT_KEY }} models/
          zip -rg ${{ env.ARTIFACT_KEY }} repositories/
          zip -rg ${{ env.ARTIFACT_KEY }} schemas/
          echo "### Package Created" >> $GITHUB_STEP_SUMMARY
          echo "- Filename: ${{ env.ARTIFACT_KEY }}" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -h ${{ env.ARTIFACT_KEY }} | cut -f1)" >> $GITHUB_STEP_SUMMARY

      # -----------------------------
      # UPLOAD TO S3
      # -----------------------------
      - name: Upload Artifact to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp ${{ env.ARTIFACT_KEY }} s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}
          echo "### Artifact Uploaded Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: ${{ env.ARTIFACT_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- Key: ${{ env.ARTIFACT_KEY }}" >> $GITHUB_STEP_SUMMARY